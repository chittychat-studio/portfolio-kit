<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Portfolio Starter by Corporate AI Workaround</title>
<meta name="description" content="The portfolio starter template from Corporate AI Workaround. Every [square-bracket] line is yours to fill from your LinkedIn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: seven pinned scenes on one cool-grey ground; her ID badge travels between them. Two faces, one accent, no ornament. */
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#1c2733; --mute:#5b6876; --accent:#3d6c8c; --tint:#c3d2de; --deep:#21364a;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --gx:5vw;
  --bar:64px;
  --top:calc(var(--bar) + 6vh + env(safe-area-inset-top,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
a{color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}

/* fixed layers */
.layer-back{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#rain{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
main{position:relative;z-index:3}

.j-year{position:absolute;left:25vw;bottom:3vh;transform:translateX(-50%);font-size:min(24vh,17vw);line-height:1;color:var(--tint);opacity:0;display:flex}
.odo{display:inline-flex;overflow:hidden;height:1em;line-height:1}
.odo .col{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.odo .col span{height:1em;display:block}
.contact-field{position:absolute;inset:0;background:var(--deep);clip-path:polygon(0 0,0 0,0 100%,0 100%)}
.lets{position:absolute;left:0;right:0;top:var(--top);text-align:center;color:#fff;font-size:min(28vh,19vw);line-height:.92;opacity:0}

/* ID badge */
.rig{position:absolute;left:0;top:0;width:var(--bw);transform-origin:50% 0;will-change:transform}
.strap{position:absolute;left:50%;bottom:calc(100% + 18px);width:26px;margin-left:-13px;height:200vh;background:var(--deep);transition:background .4s;box-shadow:inset 3px 0 0 rgba(255,255,255,.08),inset -3px 0 0 rgba(0,0,0,.15)}
.hook{position:absolute;left:50%;bottom:calc(100% - 4px);width:20px;height:24px;margin-left:-10px;z-index:3;border-radius:5px 5px 3px 3px;background:linear-gradient(90deg,#9aa6b1,#e5eaee 45%,#8d99a4)}
.hook i{position:absolute;left:50%;top:-14px;width:14px;height:16px;margin-left:-7px;border:3px solid #a9b4be;border-bottom:0;border-radius:8px 8px 0 0}
/* portrait: human over machine, revealed by the cursor; white line-art flows top to bottom */
.badge{position:relative;width:var(--bw);height:calc(var(--bw)*1.42);transform-style:preserve-3d;will-change:transform}
/* glass profile card */
.portrait{position:absolute;inset:0;margin:0;--mx:50%;--my:40%;--rr:0px;border-radius:calc(var(--bw)*.09);
  background:linear-gradient(155deg,rgba(255,255,255,.94),rgba(246,249,251,.88) 55%,rgba(226,234,241,.9));
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,1),0 24px 50px rgba(30,42,54,.16),0 2px 6px rgba(30,42,54,.06)}
.portrait::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.55),rgba(255,255,255,0) 32%)}
.p-cap{position:absolute;left:0;right:0;top:calc(var(--bw)*.965);display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--bw)*.018);padding:0 8%}
.p-name{font-size:calc(var(--bw)*.11);line-height:1;color:var(--ink)}
.p-role{font:italic 500 calc(var(--bw)*.043)/1.25 var(--f-body);color:var(--accent)}
.p-chip{margin-top:calc(var(--bw)*.02);display:inline-flex;align-items:center;gap:.45em;font:600 calc(var(--bw)*.038)/1 var(--f-body);color:var(--deep);
  padding:.5em .9em;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(61,108,140,.25)}
.p-chip[hidden]{display:none}
.p-chip::before{content:"";width:.5em;height:.5em;border-radius:50%;background:#D97706}
/* the bust fades out at the bottom so it sits in the page instead of looking pasted on */
.p-stack{position:absolute;left:6%;right:6%;top:calc(var(--bw)*.06);height:calc(var(--bw)*.88);border-radius:calc(var(--bw)*.065);overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 90% at 50% 30%,#f7f9fb,#dbe5ed 70%,#c9d7e3)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%;transform:scale(1.18);transform-origin:50% 14%;display:block;user-select:none;-webkit-user-drag:none}
.p-human{
  -webkit-mask-image:radial-gradient(circle var(--rr) at var(--mx) var(--my),transparent 0,transparent 62%,#000 100%);
          mask-image:radial-gradient(circle var(--rr) at var(--mx) var(--my),transparent 0,transparent 62%,#000 100%)}
.p-machine{
  -webkit-mask-image:radial-gradient(circle var(--rr) at var(--mx) var(--my),#000 0,#000 62%,transparent 100%);
          mask-image:radial-gradient(circle var(--rr) at var(--mx) var(--my),#000 0,#000 62%,transparent 100%)}
.p-lines{position:absolute;inset:0;pointer-events:none;opacity:.9;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40%,#000 60%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 40%,#000 60%,transparent 100%);
  -webkit-mask-size:100% 42%;mask-size:100% 42%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
/* the scan band shows the white machine face under the mesh as it passes */
.p-scanm{position:absolute;inset:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%,#000 62%,transparent 100%);
  -webkit-mask-size:100% 42%;mask-size:100% 42%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.p-beam{position:absolute;left:8%;right:8%;top:0;height:2px;margin-top:-1px;pointer-events:none;will-change:transform;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 30%,#fff 50%,rgba(255,255,255,.95) 70%,rgba(255,255,255,0));box-shadow:0 0 10px 2px rgba(190,235,255,.75),0 0 26px 6px rgba(120,220,255,.35);opacity:.9}
.p-hint{display:none}
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.p-lines{-webkit-mask:none;mask:none;opacity:.35}}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.sleeve{position:absolute;inset:0;border-radius:calc(var(--bw)*.06);background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 18px 40px rgba(30,42,54,.16);padding:calc(var(--bw)*.11) calc(var(--bw)*.045) calc(var(--bw)*.045)}
.sleeve::after{content:"";position:absolute;left:0;top:0;width:34%;height:calc(var(--bw)*.11);border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);pointer-events:none}
.hole{position:absolute;left:50%;top:calc(var(--bw)*.035);width:28%;height:calc(var(--bw)*.04);margin-left:-14%;border-radius:99px;background:rgba(30,42,54,.18)}
.idc{position:relative;height:100%;background:#fff;border-radius:calc(var(--bw)*.03);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.geo{position:absolute;left:0;right:0;top:0;height:42%;overflow:hidden}
.geo svg{display:block;width:100%;height:100%}
.geo.bot{top:auto;bottom:0;height:30%}
.pframe{position:relative;margin:0;width:100%;aspect-ratio:1/.76;border-radius:0;background:none;padding:0;flex:none;max-width:100%;border-bottom:calc(var(--bw)*.022) solid var(--accent)}
.idc>.geo:not(.bot){display:none}
.photo{position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;background:var(--accent)}
.photo img,.photo span{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
/* half-human, half-bot: crisp vector plates and circuit traces over one side of the face (SVG, so it stays sharp at any DPI) */
.photo img{image-rendering:auto;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}
.cyb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;shape-rendering:geometricPrecision}
.cyb .trace{stroke-dasharray:6 200;animation:trace 3.6s linear infinite}
.cyb .trace:nth-of-type(2n){animation-delay:-1.2s}.cyb .trace:nth-of-type(3n){animation-delay:-2.4s}
@keyframes trace{from{stroke-dashoffset:206}to{stroke-dashoffset:0}}
.cyb .eye{animation:eye 2.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes eye{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.cyb .trace,.cyb .eye{animation:none}.cyb .trace{stroke-dasharray:none}}
.b-name{font-family:var(--f-display);font-size:calc(var(--bw)*.1);line-height:1;margin-top:calc(var(--bw)*.05);color:var(--ink);position:relative}
.b-role{font-size:calc(var(--bw)*.042);color:var(--accent);font-style:italic;font-weight:500;margin-top:calc(var(--bw)*.015);line-height:1.25;padding:0 8%}
.b-fields{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--bw)*.008) calc(var(--bw)*.03);margin-top:calc(var(--bw)*.04);font-size:calc(var(--bw)*.036);text-align:left;width:76%;line-height:1.3}
.b-fields span{color:var(--mute)}
.b-fields b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barcode{margin-top:auto;margin-bottom:calc(var(--bw)*.05);width:76%;height:calc(var(--bw)*.075);background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
.back-in{justify-content:flex-start;padding:calc(var(--bw)*.08) calc(var(--bw)*.07) 0}
.b-bio{margin:0;font-size:calc(var(--bw)*.04);line-height:1.45;color:var(--ink)}
.b-meta{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--bw)*.01) calc(var(--bw)*.03);margin-top:calc(var(--bw)*.05);font-size:calc(var(--bw)*.035);text-align:left;width:100%}
.b-meta span{color:var(--mute);letter-spacing:.04em}
.b-meta b{font-weight:600}
.b-logos{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:calc(var(--bw)*.06);position:relative;z-index:1}
.hex{width:calc(var(--bw)*.24);aspect-ratio:1/1.1;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:calc(var(--bw)*.09)}
.qr{width:calc(var(--bw)*.26);aspect-ratio:1;background:#fff}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}

/* sections */
.sec{position:relative}
.pin{position:sticky;top:0;height:100vh;height:100lvh}
.inner{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.h2{font-family:var(--f-display);font-size:clamp(40px,4.6vw,88px);line-height:1}

/* hero */
.hero-copy{left:var(--gx);top:calc(var(--bar) + 2px + env(safe-area-inset-top,0px));width:min(58vw,880px)}
.avatar{display:none}
.portrait.framed .p-human{-webkit-mask-image:none;mask-image:none}
.p-init{position:absolute;inset:0;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:calc(var(--bw)*.34)}
.hero-big{font-family:var(--f-display);font-size:clamp(60px,min(9vw,15vh),180px);line-height:.84;color:var(--tint);white-space:nowrap;margin:0 0 .12em -.03em;perspective:800px}
.hero-big .hn-first{display:block;font-size:.27em;line-height:1.1;color:var(--ink);margin:0 0 .42em .1em;letter-spacing:.01em}
.logo{transition:color .4s,opacity .35s}
body.at-top .logo{opacity:0;pointer-events:none}
body.at-top:not(.on-dark) .hud{background:transparent}
.hero-big span{display:inline-block;will-change:transform}
.hi{margin:0 0 .5vh;font-size:clamp(17px,1.5vw,24px);font-weight:500;color:var(--mute)}
.title{font-family:var(--f-display);font-size:clamp(34px,min(5.4vw,9.5vh),88px);line-height:1;color:var(--ink)}
.title .ln{display:block;overflow:hidden;padding-bottom:.06em}
.title .ln>span{display:block}
.desc{max-width:36em;font-size:clamp(17px,1.3vw,21px);line-height:1.5;margin:3vh 0 3.4vh}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;border:0;background:var(--accent);color:#fff;transition:background .25s,transform .15s}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--deep);transform:translateY(101%);transition:transform .5s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover::before{transform:none}
.btn.alt::before,.nav .btn.rvb::before,body.on-dark .nav .btn::before{background:var(--tint)}
.rl{display:inline-block;overflow:hidden;height:1.3em;line-height:1.3em;vertical-align:middle}
.rl>span{display:block;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.rl>span::after{content:attr(data-t);display:block}
.btn:hover .rl>span{transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){.btn::before,.rl>span{transition:none}}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--surface);color:var(--ink)}


/* about */
.about-col{left:46vw;right:var(--gx);top:calc(var(--bar) + 3vh + env(safe-area-inset-top,0px));bottom:6vh;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.statement{font-size:clamp(22px,2vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.18;margin:0;max-width:22em}
.statement .w{display:inline-block;will-change:transform,opacity}
.about-col .more{font-size:clamp(16px,1.15vw,19px);line-height:1.55;max-width:38em;margin:2.2vh 0 0}
.cc-pill{display:inline-flex;align-items:center;gap:10px;margin:2.2vh 0 0;padding:7px 18px 7px 7px;border-radius:999px;background:var(--accent);color:#fff;font:600 clamp(14px,1vw,17px)/1.2 var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;perspective:900px}
.stat{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.stat .num{font-family:var(--f-display);font-size:clamp(48px,4.8vw,92px);line-height:1;display:flex}
.stat .num .suf{color:var(--accent)}
.stat p{margin:8px 0 0;font-size:16px;line-height:1.35;max-width:14em}

/* work */
.work-head{left:var(--gx);right:var(--gx);top:calc(var(--bar) + 2.5vh + env(safe-area-inset-top,0px));display:flex;align-items:flex-end;gap:32px}
.wbar{width:160px;height:6px;background:var(--surface);border-radius:3px;position:relative;margin-bottom:.9em;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.deck{left:var(--gx);top:calc(var(--bar) + 2.5vh + clamp(40px,4.6vw,88px) + 16px + env(safe-area-inset-top,0px));width:min(70vw,1100px);height:70vh;perspective:1500px}
.card{position:absolute;inset:0 0 auto 0;background:var(--surface);border-radius:4px;display:grid;grid-template-columns:1.45fr .55fr;align-items:start;gap:16px 36px;padding:clamp(18px,2.2vw,34px);will-change:transform,opacity;transform-origin:50% 100%}
.card .info{display:flex;flex-direction:column;min-width:0}
.card>*{min-width:0}
.card .cat{font-size:15px;color:var(--mute)}
.card h3{font-family:var(--f-display);font-size:clamp(30px,3vw,56px);line-height:1;margin:10px 0 12px}
.pts{margin:4px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;font-size:clamp(15px,1.05vw,18px);line-height:1.45;max-width:36em}
.pts li::marker{color:var(--accent)}


/* work cards as Jira-style tickets */
.card{--cp:clamp(18px,2.2vw,34px);padding:var(--cp)}
.tk-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:calc(var(--cp)*-1) calc(var(--cp)*-1) 0;padding:12px var(--cp);background:#e9eef4;border-radius:4px 4px 0 0;font-size:14px;color:var(--mute)}
.tk-crumb{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.tk-crumb i{font-style:normal;opacity:.6}
.tk-key{color:var(--accent);font-weight:700;letter-spacing:.02em}
.tk-ic{width:18px;height:18px;border-radius:4px;background:#2f9e6b;position:relative;flex:none;display:inline-block}
.tk-ic::after{content:"";position:absolute;left:5px;top:4px;width:8px;height:10px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.tk-ic.sm{width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.tk-ic.sm::after{left:4px;top:3px;width:6px;height:8px}
.tk-type{display:block;font-size:14px;color:var(--mute);margin:-4px 0 10px}
.tk-st{margin-left:auto;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap}
.tk-st.done{background:#d6f2e1;color:#1d6b40}
.tk-st.prog{background:#dbe7f6;color:#1f5aa6}
.tk-st.live{background:#2f9e6b;color:#fff}
.tk-h{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:4px 0 6px}
.pts{list-style:none;padding-left:0}
.pts li{position:relative;padding-left:1.5em}
.pts li::before{content:"✓\FE0E";position:absolute;left:0;top:0;color:#1e6a3b;font-weight:700}
.tk-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--mute)}
.tk-foot b{color:var(--ink);font-weight:600}
.tk-av{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font:700 11px var(--f-body);flex:none}
.tk-av img{width:100%;height:100%;object-fit:cover}
.tk-org{font-weight:600;color:var(--accent)}
.tk-foot .lnk{margin:0}
.facts .tk-h{margin:0}
.facts .tk-tools{margin-top:4px}
.facts .tk-tools .tk-h{margin:0 0 4px}
/* 30-second recruiter view */
.rv{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .55s cubic-bezier(.7,0,.2,1)}
.rv.open{transform:none}
.rv-in{max-width:1100px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(var(--gx),16px) 48px}
.rv-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.rv-head h2{font-family:var(--f-display);font-size:clamp(28px,3vw,48px);line-height:1}
.rv-x{border:0;background:var(--surface);color:var(--ink);font:600 15px var(--f-body);height:44px;padding:0 20px;border-radius:999px;cursor:pointer}
.rv-x:hover{background:var(--tint)}
.rv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rv-card{background:var(--surface);border-radius:6px;padding:22px 24px;min-width:0}
.rv-card h3{font-family:var(--f-display);font-size:22px;line-height:1.1;margin-bottom:12px;color:var(--accent)}
.rv-card p{margin:0 0 8px}
.rv-card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.rv-who{grid-column:1/-1;display:flex;gap:20px;align-items:center}
.rv-who .ph{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:none;background:var(--accent);color:#fff;display:grid;place-items:center;font:400 34px var(--f-display)}
.rv-who .ph img{width:100%;height:100%;object-fit:cover}
.rv-who .nm{font-family:var(--f-display);font-size:clamp(26px,2.6vw,40px);line-height:1}
.rv-who .rl{color:var(--mute);margin-top:4px}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const eOC = t => 1 - Math.pow(1 - t, 3);
const eIOS = t => -(Math.cos(Math.PI * t) - 1) / 2;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = () => innerWidth < 820;
function makeOdo(digits) {
  const wrap = h("span", "odo"); const cols = [];
  for (let i = 0; i < digits; i++) { const c = h("span", "col"); for (let d = 0; d <= 10; d++) c.appendChild(h("span", "", String(d % 10))); wrap.appendChild(c); cols.push(c); }
  let last = null;
  return { el: wrap, set(n) { n = Math.round(n); if (n === last) return; last = n; const s = String(n).padStart(digits, "0"); cols.forEach((c, i) => c.style.transform = `translateY(${-(+s[i])}em)`); } };
}
